<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Pink Bakery</title>

<style>
body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background:#fff0f5;
}

/* HEADER */
header{
    background:#ff6f91;
    color:white;
    padding:20px;
    text-align:center;
}

/* PRODUCT LIST */
.container{
    padding:30px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:15px;
    padding:15px;
    text-align:center;
    box-shadow:0 5px 12px rgba(0,0,0,0.1);
}

.card img{
    width:100%;
    border-radius:12px;
}

.card h3{
    margin:10px 0;
}

.price{
    color:#ff3f6c;
    font-weight:bold;
    margin-bottom:10px;
}

.card button{
    background:#ff6f91;
    color:white;
    border:none;
    padding:10px;
    width:100%;
    border-radius:8px;
    cursor:pointer;
}

/* CART */
.cart{
    margin-top:40px;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 12px rgba(0,0,0,0.1);
}

.cart ul{
    list-style:none;
    padding:0;
}

.cart li{
    display:flex;
    justify-content:space-between;
    margin:8px 0;
}

.total{
    font-size:18px;
    font-weight:bold;
    color:#ff3f6c;
    margin-top:10px;
}

.order-btn{
    margin-top:15px;
    width:100%;
    padding:12px;
    background:#ff3f6c;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}

/* FOOTER */
footer{
    margin-top:40px;
    background:#ff6f91;
    color:white;
    text-align:center;
    padding:15px;
}
</style>
</head>

<body>

<header>
    <h1>🍰 TIỆM BÁNH NGỌT</h1>
    <p>Bánh ngọt xinh – Ngọt ngào mỗi ngày</p>
</header>

<div class="container">
    <h2>Sản phẩm</h2>

    <div class="products">
        <div class="card">
            <img src="https://tse4.mm.bing.net/th/id/OIP.8vaVDJAhtGM31r-ohI2UsQHaEo?pid=Api&h=220&P=0">
            <h3>Bánh kem dâu</h3>
            <p class="price">120.000đ</p>
            <button onclick="addToCart('Bánh kem dâu',120000)">Thêm vào giỏ</button>
        </div>

        <div class="card">
            <img src="https://tse1.mm.bing.net/th/id/OIP.LM4lv1qN8WwR9p9fYWOqSQHaLH?pid=Api&h=220&P=0">
            <h3>Cupcake socola</h3>
            <p class="price">40.000đ</p>
            <button onclick="addToCart('Cupcake socola',40000)">Thêm vào giỏ</button>
        </div>

        <div class="card">
            <img src="https://tse1.mm.bing.net/th/id/OIP.InjjuJKM2tJw9-ECD87QnwHaHa?pid=Api&h=220&P=0">
            <h3>Macaron</h3>
            <p class="price">60.000đ</p>
            <button onclick="addToCart('Macaron',60000)">Thêm vào giỏ</button>
        </div>
    </div>

    <div class="cart">
        <h2>🛒 Giỏ hàng</h2>
        <ul id="cartList"></ul>
        <div class="total">Tổng tiền: <span id="total">0</span> đ</div>
        <button class="order-btn" onclick="order()">Đặt hàng</button>
    </div>
</div>

<footer>
    © 2026 TIỆM BÁNH NGỌT| Hotline: 31082008
</footer>

<script>
let total = 0;

function addToCart(name, price){
    const ul = document.getElementById("cartList");
    const li = document.createElement("li");
    li.innerHTML = `<span>${name}</span><span>${price.toLocaleString()}đ</span>`;
    ul.appendChild(li);

    total += price;
    document.getElementById("total").innerText = total.toLocaleString();
}

function order(){
    if(total === 0){
        alert("Giỏ hàng đang trống!");
    } else {
        alert("🎉 Đặt hàng thành công!\nTổng tiền: " + total.toLocaleString() + "đ");
        location.reload();
    }
}
</script>

</body>
</html>
